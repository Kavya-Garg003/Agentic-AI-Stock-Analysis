<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI Stock Analysis | Premium Investor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --surface-color-light: #1e1e1e;
            --primary-accent: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.2);
            --secondary-accent: #00b8ff;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --danger: #ff3366;
            --warning: #ffcc00;
            --border-color: #333;
            --glass-bg: rgba(18, 18, 18, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, var(--primary-glow), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 184, 255, 0.1), transparent 25%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .search-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        button {
            background: linear-gradient(135deg, var(--primary-accent), #00cc6a);
            color: #000;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        button:active {
            transform: translateY(0);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            display: none;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-accent), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .data-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .data-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .chart-container {
            grid-column: span 3;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: 400px;
        }

        .recommendation {
            grid-column: span 3;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 184, 255, 0.1));
            border: 1px solid var(--primary-accent);
            text-align: center;
            padding: 3rem;
        }

        .rec-value {
            font-size: 4rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--primary-accent);
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 1rem;
        }
        
        .score-display {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }

        .score-item {
            background: rgba(0,0,0,0.5);
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid var(--surface-color-light);
            border-bottom-color: var(--primary-accent);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 3rem auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: var(--danger);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        /* Value Colors */
        .positive { color: var(--primary-accent); }
        .negative { color: var(--danger); }
        .neutral { color: var(--warning); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Agentic AI Stock Analysis</h1>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Modern Investor View</div>
    </header>

    <div class="search-panel">
        <div class="input-group">
            <label>Company Name</label>
            <input type="text" id="company" placeholder="e.g., Apple Inc." value="Apple Inc.">
        </div>
        <div class="input-group">
            <label>Ticker Symbol</label>
            <input type="text" id="ticker" placeholder="e.g., AAPL" value="AAPL">
        </div>
        <button id="analyzeBtn" onclick="analyzeStock()">Analyze Asset</button>
    </div>

    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="dashboard" id="dashboard">
        <div class="card recommendation">
            <div class="card-title" style="justify-content: center;">AI INVESTMENT DECISION</div>
            <div class="rec-value" id="finalDecision">BUY</div>
            <div style="color: var(--text-main); font-size: 1.1rem;" id="reasoningText"></div>
            <div class="score-display">
                <div class="score-item">
                    <div class="data-label">Total Score</div>
                    <div class="data-value" id="totalScore" style="font-size: 1.5rem;">0/100</div>
                </div>
                <div class="score-item">
                    <div class="data-label">Confidence</div>
                    <div class="data-value" id="confidenceScore" style="font-size: 1.5rem;">0%</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Fundamental Score</div>
            <div class="data-value" id="fundScore">--</div>
            <div class="data-label">P/E, ROE, Margins</div>
        </div>
        
        <div class="card">
            <div class="card-title">CANSLIM Rating</div>
            <div class="data-value" id="canslimScore">--</div>
            <div class="data-label">Growth & Momentum</div>
        </div>

        <div class="card">
            <div class="card-title">Market Sentiment</div>
            <div class="data-value" id="sentimentScore">--</div>
            <div class="data-label" id="sentimentClass">--</div>
        </div>

        <div class="card">
            <div class="card-title">Risk Assessment</div>
            <div class="data-value" id="riskScore">--</div>
            <div class="data-label">Volatility & Debt</div>
        </div>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script>
    let currentChart = null;

    async function analyzeStock() {
        const company = document.getElementById('company').value;
        const ticker = document.getElementById('ticker').value;
        const btn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const dashboard = document.getElementById('dashboard');
        const errorMsg = document.getElementById('errorMsg');

        if (!company || !ticker) return;

        btn.disabled = true;
        btn.innerHTML = "Processing...";
        loader.style.display = 'block';
        dashboard.style.display = 'none';
        errorMsg.style.display = 'none';

        try {
            const res = await fetch(`/analyze?company=${encodeURIComponent(company)}&ticker=${encodeURIComponent(ticker)}`);
            const data = await res.json();
            
            if(data.error) {
                throw new Error(data.error);
            }

            populateDashboard(data);
            
            dashboard.style.display = 'grid';
        } catch (err) {
            errorMsg.innerText = "Error: " + err.message;
            errorMsg.style.display = 'block';
        } finally {
            loader.style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = "Analyze Asset";
        }
    }

    function populateDashboard(data) {
        const results = data.analysis_results;
        const dec = results.final_decision;
        
        const recValue = document.getElementById('finalDecision');
        recValue.innerText = dec.recommendation;
        if(dec.recommendation === 'BUY') {
            recValue.style.color = 'var(--primary-accent)';
            recValue.style.textShadow = '0 0 20px var(--primary-glow)';
        } else if(dec.recommendation === 'SELL') {
            recValue.style.color = 'var(--danger)';
            recValue.style.textShadow = '0 0 20px rgba(255,51,102,0.3)';
        } else {
            recValue.style.color = 'var(--warning)';
            recValue.style.textShadow = '0 0 20px rgba(255,204,0,0.3)';
        }

        document.getElementById('reasoningText').innerText = dec.reasoning;
        document.getElementById('totalScore').innerText = `${dec.total_score.toFixed(1)}/100`;
        document.getElementById('confidenceScore').innerText = `${(dec.confidence * 100).toFixed(1)}%`;

        document.getElementById('fundScore').innerText = dec.decision_factors.fundamental_score.toFixed(1);
        
        let canslim = dec.decision_factors.canslim_score.toFixed(1);
        if(results.canslim && results.canslim.total_score) {
            canslim += ` (${results.canslim.total_score}/7)`;
        }
        document.getElementById('canslimScore').innerText = canslim;

        document.getElementById('sentimentScore').innerText = dec.decision_factors.sentiment_score.toFixed(1);
        document.getElementById('sentimentClass').innerText = results.sentiment.classification;

        document.getElementById('riskScore').innerText = dec.decision_factors.risk_score.toFixed(1);

        renderChart(data.chart_data);
    }

    function renderChart(chartData) {
        if(!chartData || !chartData.dates) return;
        
        const ctx = document.getElementById('priceChart').getContext('2d');
        if(currentChart) currentChart.destroy();

        // Create gradient
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 255, 136, 0.5)');
        gradient.addColorStop(1, 'rgba(0, 255, 136, 0.0)');

        currentChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.dates,
                datasets: [{
                    label: 'Close Price',
                    data: chartData.prices,
                    borderColor: '#00ff88',
                    borderWidth: 2,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(18, 18, 18, 0.8)',
                        titleColor: '#a0a0a0',
                        bodyColor: '#fff',
                        borderColor: '#333',
                        borderWidth: 1
                    }
                },
                scales: {
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: { color: '#a0a0a0', maxTicksLimit: 7 }
                    },
                    y: {
                        grid: { color: '#333', drawBorder: false },
                        ticks: { color: '#a0a0a0' }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
    }
</script>

</body>
</html>
